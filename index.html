<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đánh Giá Của Chúng Tôi ⭐</title>
  <meta name="description" content="Cảm ơn bạn! Nhấn vào đây để để lại đánh giá cho chúng tôi trên Google Maps." />
  <!-- Redirect immediately -->
  <meta http-equiv="refresh" content="0; url=https://g.page/r/CcFqFAmBpFFHEAE/review" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #FFD700;
      --gold-light: #FFE566;
      --bg-start: #0f0c29;
      --bg-mid: #302b63;
      --bg-end: #24243e;
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.65);
      --card-bg: rgba(255,255,255,0.07);
      --card-border: rgba(255,255,255,0.13);
      --btn-bg: linear-gradient(135deg, #FFD700 0%, #FF8C00 100%);
      --btn-shadow: 0 8px 32px rgba(255,165,0,0.45);
    }
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      overflow: hidden;
    }
    /* Animated background blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      animation: float 8s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 { width: 420px; height: 420px; background: #FFD700; top: -10%; left: -10%; animation-delay: 0s; }
    .blob-2 { width: 320px; height: 320px; background: #FF6B6B; bottom: -5%; right: -8%; animation-delay: 2s; }
    .blob-3 { width: 260px; height: 260px; background: #4ECDC4; top: 40%; left: 60%; animation-delay: 4s; }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(20px, -20px) scale(1.06); }
    }
    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 52px 44px 44px;
      max-width: 420px;
      width: calc(100% - 32px);
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: slideUp 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* Stars */
    .stars {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 24px;
    }
    .star {
      font-size: 32px;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    .star:nth-child(1) { animation-delay: 0.1s; }
    .star:nth-child(2) { animation-delay: 0.18s; }
    .star:nth-child(3) { animation-delay: 0.26s; }
    .star:nth-child(4) { animation-delay: 0.34s; }
    .star:nth-child(5) { animation-delay: 0.42s; }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0) rotate(-30deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    /* Google icon badge */
    .google-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50px;
      padding: 6px 16px 6px 10px;
      margin-bottom: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: var(--text-muted);
    }
    .google-badge svg { flex-shrink: 0; }
    h1 {
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 30%, #FFD700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }
    /* CTA Button */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--btn-bg);
      color: #1a1000;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      padding: 16px 36px;
      border-radius: 50px;
      box-shadow: var(--btn-shadow);
      border: none;
      cursor: pointer;
      width: 100%;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      letter-spacing: 0.2px;
    }
    .btn:hover, .btn:focus-visible {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 14px 40px rgba(255,165,0,0.60);
      filter: brightness(1.08);
      outline: none;
    }
    .btn:active {
      transform: translateY(0) scale(0.98);
    }
    .btn svg { flex-shrink: 0; }
    /* Progress bar */
    .redirect-bar {
      margin-top: 28px;
    }
    .redirect-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .bar-track {
      height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FFD700, #FF8C00);
      border-radius: 99px;
      animation: fillBar 2s linear forwards;
    }
    @keyframes fillBar {
      to { width: 100%; }
    }
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 28px 0 20px;
    }
    .footer-note {
      font-size: 11.5px;
      color: var(--text-muted);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <!-- Background blobs -->
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="blob blob-3" aria-hidden="true"></div>
  <main class="card" role="main">
    <div class="stars" aria-label="5 sao">
      <span class="star" aria-hidden="true">⭐</span>
      <span class="star" aria-hidden="true">⭐</span>
      <span class="star" aria-hidden="true">⭐</span>
      <span class="star" aria-hidden="true">⭐</span>
      <span class="star" aria-hidden="true">⭐</span>
    </div>
    <div class="google-badge" aria-label="Google Maps Review">
      <!-- Google "G" SVG -->
      <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Google Maps Review
    </div>
    <h1>Chia sẻ trải nghiệm của bạn!</h1>
    <p>Đánh giá của bạn giúp chúng tôi phát triển và giúp khách hàng khác tìm thấy chúng tôi dễ dàng hơn. Chỉ mất 30 giây thôi! 🙏</p>
    <a
      id="review-btn"
      href="https://g.page/r/CcFqFAmBpFFHEAE/review"
      class="btn"
      target="_top"
      rel="noopener noreferrer"
      aria-label="Mở trang đánh giá Google ngay bây giờ"
    >
      <!-- Star icon -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
      </svg>
      Đánh giá ngay trên Google
    </a>
    <div class="redirect-bar" role="status" aria-live="polite">
      <div class="redirect-label">Đang tự động chuyển hướng…</div>
      <div class="bar-track">
        <div class="bar-fill"></div>
      </div>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <p class="footer-note">Nếu trang không tự chuyển, hãy nhấn nút bên trên.</p>
  </main>
  <script>
    // Primary redirect — fires immediately
    (function () {
      var TARGET = 'https://g.page/r/CcFqFAmBpFFHEAE/review';
      // Try location replace first (same tab, no history entry)
      try {
        window.location.replace(TARGET);
      } catch (e) {
        window.location.href = TARGET;
      }
      // Fallback: open in top-level context if inside iframe / webview
      if (window !== window.top) {
        window.top.location.href = TARGET;
      }
      // Button also forces top-level navigation
      var btn = document.getElementById('review-btn');
      if (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();
          window.top.location.href = TARGET;
        });
      }
    })();
  </script>
</body>
</html>
